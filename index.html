<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f5ef">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230ea5e9'/%3E%3Cstop offset='1' stop-color='%231e40af'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-family='Segoe UI,Arial,sans-serif' font-size='30' font-weight='800' text-anchor='middle' fill='white'%3EBE%3C/text%3E%3C/svg%3E">
<script>
(function(){var t=null;try{t=localStorage.getItem("theme")}catch(e){}
if(t!=="dark"&&t!=="light"){t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}
document.documentElement.dataset.theme=t})();
</script>
<title>Benjamin ELONGUE — Portfolio</title>
<meta name="description" content="Portfolio de Benjamin ELONGUE — Développeur senior / Ingénieur IA et Technicien informatique senior, Montréal.">
<style>
:root{
  /* THEME CLAIR (par défaut si le système est en clair) */
  --bg:#f7f5ef; --bg2:#eef2f8; --card:rgba(255,255,255,.72);
  --line:rgba(37,99,235,.16); --text:#12233f; --muted:#5a6b85;
  --a1:#2563eb; --a2:#0ea5e9; --a3:#1d4ed8;
  --g1:#0ea5e9; --g2:#2563eb; --g3:#1e40af;
  --grad:linear-gradient(120deg,var(--g1) 0%,var(--g2) 55%,var(--g3) 100%);
  --glow1:rgba(37,99,235,.10); --glow2:rgba(14,165,233,.13);
  --blob1:#60a5fa; --blob2:#38bdf8; --blob3:#93c5fd; --blob-op:.28;
  --header-bg:rgba(247,245,239,.78); --on-grad:#ffffff;
  --soft:rgba(37,99,235,.10); --badge-text:#1e40af; --title-text:#1e3a8a; --dot:#2563eb;
  --chip-bg:rgba(255,255,255,.85); --chip-text:#1e3a8a; --chip-hover-bg:rgba(37,99,235,.12); --chip-hover-text:#0b2a6f;
  --body-text:#34476a; --tag-bg:rgba(37,99,235,.10); --tag-text:#1d4ed8; --ghost-bg:rgba(255,255,255,.7);
  --shadow:0 12px 32px -20px rgba(30,64,175,.4); --shadow-hover:0 18px 40px -20px rgba(30,64,175,.5);
  --hover-border:rgba(37,99,235,.45); --spot:rgba(37,99,235,.10); --btn-glow:rgba(37,99,235,.45);
  --particle-rgb:37,99,235; --particle-dot:.5; --particle-line:.14;
  --radius:18px; color-scheme:light;
}
:root[data-theme="dark"]{
  /* THEME SOMBRE */
  --bg:#040e1d; --bg2:#06182e; --card:rgba(14,40,78,.42);
  --line:rgba(120,170,255,.18); --text:#e8f0fc; --muted:#9db3d0;
  --a1:#4aa8ff; --a2:#7cc4ff; --a3:#2563eb;
  --g1:#7cc4ff; --g2:#4a9dff; --g3:#3b6cf0;
  --glow1:rgba(30,80,200,.38); --glow2:rgba(14,100,170,.32);
  --blob1:#2563eb; --blob2:#0ea5e9; --blob3:#3b82f6; --blob-op:.28;
  --header-bg:rgba(4,14,29,.6); --on-grad:#031124;
  --soft:rgba(74,168,255,.12); --badge-text:#c3deff; --title-text:#d3e4ff; --dot:#4aa8ff;
  --chip-bg:rgba(4,14,29,.5); --chip-text:#d6e6ff; --chip-hover-bg:rgba(74,168,255,.18); --chip-hover-text:#ffffff;
  --body-text:#bccde6; --tag-bg:rgba(96,165,250,.12); --tag-text:#9fdcff; --ghost-bg:rgba(255,255,255,.03);
  --shadow:0 12px 32px -20px rgba(0,0,0,.6); --shadow-hover:0 18px 40px -20px rgba(74,168,255,.35);
  --hover-border:rgba(74,168,255,.45); --spot:rgba(74,168,255,.16); --btn-glow:rgba(74,168,255,.7);
  --particle-rgb:140,190,255; --particle-dot:.75; --particle-line:.16;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Segoe UI",Inter,system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.65;overflow-x:hidden;
  background-image:
    radial-gradient(1200px 700px at 10% -10%,var(--glow1),transparent 60%),
    radial-gradient(1000px 700px at 100% 10%,var(--glow2),transparent 60%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  background-attachment:fixed;
}
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:var(--blob-op);z-index:0;pointer-events:none;animation:float 22s ease-in-out infinite}
.blob.b1{width:420px;height:420px;background:var(--blob1);top:8%;left:-120px}
.blob.b2{width:480px;height:480px;background:var(--blob2);bottom:-120px;right:-140px;animation-delay:-8s}
.blob.b3{width:300px;height:300px;background:var(--blob3);top:45%;left:55%;animation-delay:-14s;opacity:calc(var(--blob-op)*.65)}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,-40px) scale(1.1)}66%{transform:translate(-40px,50px) scale(.95)}}
main,header,footer{position:relative;z-index:1}
a{color:inherit;text-decoration:none}
.wrap{width:min(1120px,92%);margin:0 auto}

/* NAV */
header{position:fixed;top:0;left:0;right:0;z-index:50;backdrop-filter:blur(14px);background:var(--header-bg);border-bottom:1px solid var(--line);transition:transform .35s}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{font-weight:800;letter-spacing:.5px;font-size:1.1rem;display:flex;align-items:center;gap:.6rem}
.logo i{font-style:normal;display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--grad);color:var(--on-grad);font-weight:900}
nav ul{display:flex;gap:.3rem;list-style:none}
nav button.link{background:none;border:0;color:var(--muted);font:inherit;font-size:.92rem;padding:.5rem .85rem;border-radius:999px;cursor:pointer;transition:.25s}
nav button.link:hover,nav button.link.active{color:var(--text);background:var(--soft)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--muted);font:inherit;font-weight:700;font-size:.82rem;padding:.4rem .8rem;cursor:pointer;transition:.25s}
.lang button.on{background:var(--grad);color:var(--on-grad)}
.progress{position:absolute;bottom:-1px;left:0;height:2px;width:0;background:var(--grad)}
.tools{display:flex;align-items:center;gap:.6rem}
.theme-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--ghost-bg);color:var(--text);display:grid;place-items:center;cursor:pointer;transition:transform .3s,border-color .3s,background .3s}
.theme-btn:hover{border-color:var(--a1);transform:rotate(18deg)}
.theme-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.theme-btn .i-sun{display:none}
:root[data-theme="dark"] .theme-btn .i-sun{display:block}
:root[data-theme="dark"] .theme-btn .i-moon{display:none}

/* MOBILE : menu latéral à gauche (icône 3 barres) */
.nav-left{display:flex;align-items:center;gap:.7rem}
.burger{display:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--ghost-bg);cursor:pointer;padding:0;position:relative;transition:border-color .25s}
.burger:hover{border-color:var(--a1)}
.burger span{position:absolute;left:10px;right:10px;height:2px;border-radius:2px;background:var(--text);transition:transform .3s,opacity .2s,top .3s}
.burger span:nth-child(1){top:13px}.burger span:nth-child(2){top:19px}.burger span:nth-child(3){top:25px}
.menu-open .burger span:nth-child(1){top:19px;transform:rotate(45deg)}
.menu-open .burger span:nth-child(2){opacity:0}
.menu-open .burger span:nth-child(3){top:19px;transform:rotate(-45deg)}
.scrim,.drawer{display:none}
@media(max-width:860px){
  .nav>nav{display:none}
  .burger{display:block}
  .scrim{display:block;position:fixed;inset:0;z-index:58;background:rgba(2,10,25,.5);opacity:0;pointer-events:none;transition:opacity .3s}
  .drawer{display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:60;width:min(290px,82vw);padding:1.2rem 1rem;background:var(--bg);border-right:1px solid var(--line);box-shadow:20px 0 50px -25px rgba(0,0,0,.5);transform:translateX(-102%);visibility:hidden;transition:transform .3s ease,visibility 0s .3s}
  .menu-open .drawer{transform:none;visibility:visible;transition:transform .3s ease}
  .menu-open .scrim{opacity:1;pointer-events:auto}
  .menu-open{overflow:hidden}
  .drawer-head{display:flex;align-items:center;gap:.7rem;padding:.2rem .4rem 1.1rem;margin-bottom:.6rem;border-bottom:1px solid var(--line);font-weight:800}
  .drawer-head i{font-style:normal;display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--grad);color:var(--on-grad);font-weight:900}
  .drawer ul{list-style:none;display:flex;flex-direction:column;gap:.25rem}
  .drawer button.link{width:100%;text-align:left;background:none;border:0;color:var(--muted);font:inherit;font-size:1rem;padding:.8rem 1rem;border-radius:12px;cursor:pointer;transition:.2s}
  .drawer button.link:hover,.drawer button.link.active{color:var(--text);background:var(--soft)}
}

/* HERO */
.hero{min-height:100vh;display:flex;align-items:center;padding:120px 0 70px}
.hero-grid{display:grid;grid-template-columns:1fr;gap:3rem;align-items:center}
.hero.has-photo .hero-grid{grid-template-columns:1.4fr .8fr}
@media(max-width:860px){.hero.has-photo .hero-grid{grid-template-columns:1fr}.photo-wrap{order:-1;justify-self:center}}
.badge{display:inline-flex;align-items:center;gap:.55rem;padding:.4rem .95rem;border:1px solid var(--line);border-radius:999px;background:var(--soft);font-size:.85rem;color:var(--badge-text)}
.badge .dot{width:9px;height:9px;border-radius:50%;background:var(--dot);box-shadow:0 0 0 0 rgba(74,168,255,.7);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(74,168,255,0)}100%{box-shadow:0 0 0 0 rgba(74,168,255,0)}}
h1{font-size:clamp(2.4rem,6vw,4.4rem);line-height:1.08;margin:1.2rem 0 .6rem;font-weight:800;letter-spacing:-1px}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.title-line{font-size:clamp(1.1rem,2.4vw,1.5rem);color:var(--title-text);font-weight:600}
.typed{min-height:2.2rem;font-size:clamp(1.05rem,2.2vw,1.35rem);color:var(--a1);font-family:Consolas,"Courier New",monospace;margin-top:.6rem}
.lead{color:var(--muted);max-width:640px;margin:1.3rem 0 1.8rem;font-size:1.05rem}
.cta{display:flex;flex-wrap:wrap;gap:.9rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.85rem 1.5rem;border-radius:14px;font-weight:700;border:1px solid transparent;cursor:pointer;font-size:.98rem;transition:transform .25s,box-shadow .25s;font-family:inherit}
.btn.primary{background:var(--grad);color:var(--on-grad);box-shadow:0 10px 30px -10px var(--btn-glow)}
.btn.ghost{background:var(--ghost-bg);color:var(--text);border-color:var(--line)}
.btn:hover{transform:translateY(-3px)}
.btn.ghost:hover{border-color:var(--a1);box-shadow:0 10px 30px -14px var(--a1)}

.photo-wrap{position:relative;width:min(340px,70vw);aspect-ratio:1;display:none}
.hero.has-photo .photo-wrap{display:block;animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:scale(.8) rotate(-4deg)}}
.photo-wrap::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:conic-gradient(from 0deg,var(--g1),var(--g2),var(--g3),var(--g1));filter:blur(2px);animation:spin 8s linear infinite}
.photo-wrap::after{content:"";position:absolute;inset:-6px;border-radius:50%;background:var(--bg)}
.photo-wrap img{position:relative;z-index:2;width:100%;height:100%;object-fit:cover;border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem;margin-top:3.2rem}
.stat{padding:1.3rem 1.2rem;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);backdrop-filter:blur(8px);text-align:center;transition:.3s}
.stat:hover{transform:translateY(-6px);border-color:var(--hover-border)}
.stat b{display:block;font-size:2.3rem;line-height:1.1;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:.88rem;color:var(--muted)}

/* SECTIONS */
section.sec{padding:90px 0}
.sec-head{margin-bottom:2.6rem}
.sec-head small{color:var(--a1);font-family:Consolas,monospace;letter-spacing:2px;text-transform:uppercase;font-size:.8rem}
.sec-head h2{font-size:clamp(1.8rem,4vw,2.6rem);margin-top:.3rem;position:relative;display:inline-block}
.sec-head h2::after{content:"";display:block;height:4px;width:120px;border-radius:4px;background:var(--grad);margin-top:.6rem}

.card{position:relative;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);backdrop-filter:blur(8px);padding:1.6rem;overflow:hidden;box-shadow:var(--shadow);transition:transform .3s,border-color .3s,box-shadow .3s}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%),var(--spot),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover{border-color:var(--hover-border);box-shadow:var(--shadow-hover)}
.card:hover::before{opacity:1}

.highlights{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.2rem}
.hl .ico{width:52px;height:52px;display:grid;place-items:center;font-size:1.6rem;border-radius:14px;background:var(--soft);border:1px solid var(--line);margin-bottom:1rem}
.hl h3{font-size:1.15rem;margin-bottom:.4rem}
.hl p{color:var(--muted);font-size:.95rem}
.hl:hover{transform:translateY(-6px)}

.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1.2rem;margin-top:1.4rem}
.skills h3{font-size:1rem;color:var(--a1);margin-bottom:1rem;display:flex;align-items:center;gap:.6rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{font-size:.84rem;padding:.35rem .8rem;border-radius:999px;border:1px solid var(--line);background:var(--chip-bg);color:var(--chip-text);opacity:0;transform:translateY(10px) scale(.95);transition:opacity .5s,transform .5s,background .25s,border-color .25s,color .25s}
.in .chip{opacity:1;transform:none}
.chip:hover{background:var(--chip-hover-bg);border-color:var(--a1);color:var(--chip-hover-text);transform:translateY(-2px)}

.timeline{position:relative;padding-left:2rem}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:0;width:2px;background:linear-gradient(var(--a2),var(--a1),transparent)}
.job{position:relative;margin-bottom:1.6rem}
.job::before{content:"";position:absolute;left:-2rem;top:1.6rem;width:16px;height:16px;border-radius:50%;background:var(--bg);border:3px solid var(--a1);box-shadow:0 0 0 6px var(--soft)}
.job-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.6rem;align-items:baseline}
.job h3{font-size:1.2rem}
.job .org{color:var(--a1);font-weight:600}
.job .date{font-family:Consolas,monospace;font-size:.82rem;color:var(--muted);padding:.2rem .7rem;border:1px solid var(--line);border-radius:999px}
.job ul{margin:1rem 0 0 1.1rem;color:var(--body-text)}
.job li{margin:.35rem 0;font-size:.95rem}
.job li::marker{color:var(--a1)}
.tags{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:1rem}
.tag{font-size:.74rem;padding:.2rem .6rem;border-radius:6px;background:var(--tag-bg);color:var(--tag-text)}

.projects{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:1.2rem}
.proj h3{display:flex;justify-content:space-between;align-items:center;gap:1rem;font-size:1.15rem;margin-bottom:.3rem}
.proj .link{font-size:.82rem;color:var(--a1);font-family:Consolas,monospace}
.proj>p{color:var(--muted);font-size:.93rem;margin-bottom:.6rem}
.proj ul{margin-left:1.1rem;color:var(--body-text);font-size:.92rem}
.proj li::marker{color:var(--a1)}
.proj:hover{transform:translateY(-6px)}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1.2rem}
.card h3.t{font-size:1.1rem;margin-bottom:1rem;color:var(--a1)}
.list{list-style:none}
.list li{padding:.55rem 0;border-bottom:1px dashed var(--line);display:flex;gap:.7rem;align-items:flex-start;font-size:.95rem}
.list li:last-child{border:0}
.list .y{margin-left:auto;font-family:Consolas,monospace;color:var(--muted);font-size:.82rem;white-space:nowrap}
.list small{display:block;color:var(--muted)}

.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.2rem}
.contact a.card{display:block;text-align:center}
.contact a.card:hover{transform:translateY(-6px)}
.contact .ico{font-size:1.8rem;margin-bottom:.5rem}
.contact b{display:block;margin-bottom:.2rem}
.contact span{color:var(--muted);font-size:.93rem;word-break:break-word}
footer{padding:36px 0;text-align:center;color:var(--muted);border-top:1px solid var(--line);font-size:.88rem}

/* skill panels (profil DEV) */
.panels{display:grid;gap:1.2rem}
.panel{display:grid;grid-template-columns:minmax(220px,1fr) 2.2fr;gap:2rem;align-items:center;padding:2rem}
@media(max-width:860px){.panel{grid-template-columns:1fr;gap:1.2rem;padding:1.5rem}}
.panel h3{font-size:1.5rem;margin-bottom:.6rem}
.panel p{color:var(--muted);font-size:.97rem}
.panel-tech .sub{width:100%;font-size:.76rem;letter-spacing:1.2px;text-transform:uppercase;color:var(--a1);font-weight:700;margin:1rem 0 .55rem}
.panel-tech .sub:first-child{margin-top:0}
.tech-grid{display:flex;flex-wrap:wrap;gap:.65rem}
.tech{width:92px;display:flex;flex-direction:column;align-items:center;gap:.4rem;padding:.7rem .3rem;border-radius:14px;background:rgba(255,255,255,.94);border:1px solid var(--line);color:#1e3a8a;font-size:.72rem;font-weight:600;text-align:center;line-height:1.25;box-shadow:0 6px 16px -12px rgba(30,64,175,.5);opacity:0;transform:translateY(10px) scale(.95);transition:opacity .5s,transform .5s,border-color .25s,box-shadow .25s}
.in .tech{opacity:1;transform:none}
.tech:hover{border-color:var(--a1);transform:translateY(-4px);box-shadow:0 12px 22px -12px rgba(30,64,175,.6)}
.tech img{width:38px;height:38px;object-fit:contain}
.tech.t{width:auto;flex-direction:row;padding:.45rem .85rem;border-radius:999px;font-size:.8rem}

/* social + footer switch */
.contact .ico svg{width:30px;height:30px;fill:currentColor;color:var(--a1)}
.social{display:flex;justify-content:center;gap:.8rem;margin-bottom:1.1rem}
.social a{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:var(--ghost-bg);color:var(--text);transition:transform .3s,border-color .3s,color .3s}
.social a:hover{transform:translateY(-3px);border-color:var(--a1);color:var(--a1)}
.social svg{width:18px;height:18px;fill:currentColor}

/* header tools */
.social-top{margin-bottom:0;gap:.5rem}
.social-top a{width:38px;height:38px}
.lang-wrap{position:relative}
.lang-wrap::after{content:"▾";position:absolute;right:.8rem;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted);font-size:.8rem}
.lang-sel{appearance:none;-webkit-appearance:none;height:38px;border:1px solid var(--line);background:var(--ghost-bg);color:var(--text);font:inherit;font-weight:600;font-size:.85rem;padding:0 2rem 0 1rem;border-radius:999px;cursor:pointer;transition:border-color .25s}
.lang-sel:hover,.lang-sel:focus{border-color:var(--a1);outline:none}
.lang-sel option{background:var(--bg);color:var(--text)}
@media(max-width:350px){.tools{gap:.4rem}.social-top{display:none}}

/* projects */
.proj.wide{grid-column:1/-1}
.proj-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.6rem}
.proj h4{font-size:.78rem;letter-spacing:1.2px;text-transform:uppercase;color:var(--a1);margin:.2rem 0 .5rem}
.tag.role{background:var(--grad);color:var(--on-grad);font-weight:700}
.proj .link:hover{text-decoration:underline}

/* reveal */
.reveal{opacity:0;transform:translateY(34px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.hero .stagger>*{opacity:0;transform:translateY(24px);animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}
.hero .stagger>*:nth-child(1){animation-delay:.1s}.hero .stagger>*:nth-child(2){animation-delay:.25s}

function currentTheme(){ return document.documentElement.dataset.theme === "dark" ? "dark" : "light"; }
function updateThemeBtn(){
  const b = document.getElementById("themeBtn"); if (!b) return;
  const dark = currentTheme() === "dark";
  const label = lang === "fr" ? (dark ? "Passer au thème clair" : "Passer au thème sombre")
                              : (dark ? "Switch to light theme" : "Switch to dark theme");
  b.title = label; b.setAttribute("aria-label", label);
}
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  const cs = getComputedStyle(document.documentElement);
  PAL.rgb  = cs.getPropertyValue("--particle-rgb").trim() || PAL.rgb;
  PAL.dot  = parseFloat(cs.getPropertyValue("--particle-dot")) || PAL.dot;
  PAL.line = parseFloat(cs.getPropertyValue("--particle-line")) || PAL.line;
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = cs.getPropertyValue("--bg").trim();
  updateThemeBtn();
}
themeMQ.addEventListener("change", e => { if (!savedTheme) applyTheme(e.matches ? "dark" : "light"); });

/* scroll reveal + counters */
function setupReveal(){
  if (io) io.disconnect();
  io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      e.target.classList.add("in");
      $$(".chip", e.target).forEach(c => c.parentElement.classList.add("in"));
      const b = $("b[data-n]", e.target);
      if (b) countUp(b);
      io.unobserve(e.target);
    });
  }, {threshold:.12, rootMargin:"0px 0px -40px 0px"});
  $$(".reveal").forEach(el => io.observe(el));
}
function countUp(el){
  const n = +el.dataset.n, s = el.dataset.s || "";
  if (reduceMotion){ el.textContent = n.toLocaleString(lang) + s; return; }
  const dur = 1600, t0 = performance.now();
  (function step(t){
    const p = Math.min((t - t0)/dur, 1), e = 1 - Math.pow(1-p, 3);
    el.textContent = Math.round(n*e).toLocaleString(lang) + s;
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}

/* card spotlight following the cursor */
function setupSpotlight(){
  $$(".card").forEach(c => c.addEventListener("pointermove", e => {
    const r = c.getBoundingClientRect();
    c.style.setProperty("--mx", (e.clientX - r.left) + "px");
    c.style.setProperty("--my", (e.clientY - r.top) + "px");
  }));
}

/* optional photo: shown only if the file exists next to this HTML file */
function loadPhoto(){
  const names = ["photo.jpg","photo.jpeg","photo.png","photo.webp"];
  const hero = $("#hero"), img = $("#photo");
  (function tryNext(i){
    if (i >= names.length) return;           // no photo found -> nothing displayed
    const probe = new Image();
    probe.onload = () => { img.src = names[i]; hero.classList.add("has-photo"); };
    probe.onerror = () => tryNext(i+1);
    probe.src = names[i];
  })(0);
}

/* background particle network */
(function(){
  if (reduceMotion) return;
  const cv = $("#bg-canvas"), ctx = cv.getContext("2d");
  let W, H, pts = [];
  function resize(){
    W = cv.width = innerWidth; H = cv.height = innerHeight;
    const n = Math.min(70, Math.floor(W*H/22000));
    pts = Array.from({length:n}, () => ({x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-.5)*.35, vy:(Math.random()-.5)*.35}));
  }
  resize(); addEventListener("resize", resize);
  (function loop(){
    ctx.clearRect(0,0,W,H);
    pts.forEach((p,i) => {
      p.x += p.vx; p.y += p.vy;
      if (p.x<0||p.x>W) p.vx*=-1; if (p.y<0||p.y>H) p.vy*=-1;
      ctx.beginPath(); ctx.arc(p.x,p.y,1.6,0,6.283); ctx.fillStyle=`rgba(${PAL.rgb},${PAL.dot})`; ctx.fill();
      for (let j=i+1;j<pts.length;j++){
        const q = pts[j], d = Math.hypot(p.x-q.x, p.y-q.y);
        if (d<140){ ctx.strokeStyle=`rgba(${PAL.rgb},${PAL.line*(1-d/140)})`; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke(); }
      }
    });
    requestAnimationFrame(loop);
  })();
})();

profileKey = getProfileKey();
applyTheme(savedTheme || (themeMQ.matches ? "dark" : "light"));
render();
</script>
