<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benjamin ELONGUE — Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f8f8fc;
            color: #151515;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero {
            width: min(1100px, 92%);
            min-height: 520px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 70px;
            padding: 50px;
        }

        .content {
            flex: 1;
            max-width: 560px;
        }

        .content .hello {
            font-size: 18px;
            font-weight: 600;
            color: #6b4ce6;
            margin-bottom: 12px;
        }

        h1 {
            font-size: clamp(42px, 6vw, 76px);
            line-height: 1.02;
            letter-spacing: -3px;
            margin-bottom: 24px;
        }

        h1 span {
            color: #6b4ce6;
        }

        .message {
            font-size: 18px;
            line-height: 1.7;
            color: #62626b;
            max-width: 440px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin-top: 30px;
            padding: 12px 18px;
            border-radius: 8px;
            background: #6b4ce6;
            color: white;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(107, 76, 230, .22);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #fff;
            animation: pulse 1.5s infinite;
        }

        .visual {
            position: relative;
            width: 390px;
            height: 390px;
            flex: 0 0 390px;
        }

        .circle {
            position: absolute;
            width: 330px;
            height: 330px;
            border-radius: 50%;
            background: #6b4ce6;
            top: 20px;
            left: 25px;
        }

        .shape {
            position: absolute;
            width: 290px;
            height: 290px;
            border-radius: 48% 52% 50% 50%;
            background: linear-gradient(145deg, #ffffff, #e7e7ed);
            right: 5px;
            bottom: 10px;
            transform: rotate(-5deg);
            box-shadow:
                0 25px 45px rgba(0, 0, 0, .12),
                inset -12px -12px 25px rgba(0, 0, 0, .04),
                inset 12px 12px 25px rgba(255, 255, 255, .9);
        }

        .shape::before {
            content: "";
            position: absolute;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(255,255,255,.72);
            top: 48px;
            left: 42px;
            box-shadow: 130px 40px 0 rgba(255,255,255,.5);
        }

        .shape::after {
            content: "";
            position: absolute;
            width: 110px;
            height: 25px;
            border-radius: 50%;
            background: rgba(0,0,0,.04);
            bottom: 55px;
            left: 90px;
            filter: blur(10px);
        }

        .floating {
            position: absolute;
            width: 95px;
            height: 95px;
            border-radius: 50%;
            background: #6b4ce6;
            right: 0;
            top: 15px;
            opacity: .12;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .45; transform: scale(.75); }
        }

        @media (max-width: 760px) {
            body {
                overflow: auto;
            }

            .hero {
                min-height: 100vh;
                flex-direction: column;
                justify-content: center;
                text-align: center;
                padding: 35px 20px;
                gap: 35px;
            }

            .content {
                order: 1;
            }

            .visual {
                order: 2;
                width: 300px;
                height: 300px;
                transform: scale(.78);
                margin-top: -20px;
                margin-bottom: -55px;
            }

            .message {
                margin: auto;
            }

            h1 {
                letter-spacing: -2px;
            }
        }
    </style>
</head>

<body>

    <main class="hero">
        <section class="content">
            <div class="hello">Bonjour, je suis</div>

            <h1>
                Benjamin<br>
                <span>ELONGUE</span>
            </h1>

            <p class="message">
                Portfolio en cours de construction.
            </p>

            <div class="badge">
                <span class="dot"></span>
                Bientôt disponible
            </div>
        </section>

        <section class="visual" aria-hidden="true">
            <div class="circle"></div>
            <div class="floating"></div>
            <div class="shape"></div>
        </section>
    </main>

</body>
</html>
